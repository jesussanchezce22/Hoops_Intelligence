
name: Test ESPN Player Stats

on:
  workflow_dispatch:

jobs:
  test-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test ESPN player box scores
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import date, timedelta

          BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          print("Testing ESPN player statistics...", flush=True)

          found = False

          # Search recent dates for a completed game.
          for days_back in range(0, 15):
              day = date.today() - timedelta(days=days_back)
              day_string = day.strftime("%Y%m%d")

              scoreboard = fetch(
                  f"{BASE}/scoreboard?dates={day_string}"
              )

              for event in scoreboard.get("events", []):
                  competitions = event.get("competitions", [])
                  if not competitions:
                      continue

                  status = competitions[0].get(
                      "status", {}
                  ).get("type", {})

                  if not status.get("completed", False):
                      continue

                  event_id = event["id"]
                  summary = fetch(
                      f"{BASE}/summary?event={event_id}"
                  )

                  boxscore = summary.get("boxscore", {})
                  teams = boxscore.get("players", [])

                  for team in teams:
                      for group in team.get("statistics", []):
                          labels = group.get("labels", [])
                          athletes = group.get("athletes", [])

                          if not athletes:
                              continue

                          print("ESPN BOX SCORE: SUCCESS")
                          print("Game ID:", event_id)
                          print("Date:", day_string)
                          print("Stat columns:", labels)
                          print("Player count in group:", len(athletes))
                          print(
                              "Example player:",
                              athletes[0].get(
                                  "athlete", {}
                              ).get("displayName")
                          )
                          print(
                              "Example stats:",
                              athletes[0].get("stats", [])
                          )

                          found = True
                          break

                      if found:
                          break

                  if found:
                      break

              if found:
                  break

          if not found:
              raise RuntimeError(
                  "No completed game with player box-score "
                  "data found in the last 15 days."
              )

          print("PLAYER STATS TEST: PASSED")
          PY
